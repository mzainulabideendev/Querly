[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oq-adapter-clickhouse"
version = "0.1.0.dev0"
description = "ClickHouse adapter (analytical SQL) for Querly"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Querly Contributors" }]
keywords = ["database", "clickhouse", "adapter", "querly"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "oq-core",
    "oq-ir",
    "oq-runtime",
    "oq-types",
    "oq-adapter-kit",
]

[project.optional-dependencies]
driver = ["clickhouse-connect>=0.7"]

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/oq_adapters"]

[tool.hatch.build.targets.sdist]
include = ["src/oq_adapters/clickhouse", "README.md"]

[project.entry-points."oq.adapters"]
clickhouse = "oq_adapters.clickhouse:ClickHouseAdapter"
