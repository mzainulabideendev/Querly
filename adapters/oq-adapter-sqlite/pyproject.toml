```toml
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oq-adapter-sqlite"
version = "0.1.0.dev0"
description = "SQLite adapter for Querly"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Querly Contributors" }]
keywords = ["database", "sqlite", "adapter", "querly"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "oq-core",
    "oq-ir",
    "oq-types",
]

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/oq_adapters/sqlite"]

[tool.hatch.build.targets.sdist]
include = ["src/oq_adapters/sqlite", "README.md"]

[project.entry-points."oq.adapters"]
sqlite = "oq_adapters.sqlite:SqliteAdapter"
```