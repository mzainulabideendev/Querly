[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oq-adapter-postgres"
version = "0.1.0.dev0"
description = "PostgreSQL adapter for Querly"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Querly Contributors" }]
keywords = ["database", "postgres", "adapter", "querly"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "oq-core",
    "oq-ir",
    "oq-types",
    "oq-runtime",
    "psycopg[binary]>=3.1",
]

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/oq_adapters/postgres"]

[tool.hatch.build.targets.sdist]
include = ["src/oq_adapters/postgres", "README.md"]

[project.entry-points."oq.adapters"]
postgres = "oq_adapters.postgres:PostgresAdapter"