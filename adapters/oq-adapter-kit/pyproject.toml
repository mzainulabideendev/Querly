[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oq-adapter-kit"
version = "0.1.0.dev0"
description = "Shared, driver-free helpers for Querly adapter distributions"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Querly Contributors" }]
keywords = ["database", "adapter", "querly", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "oq-core",
    "oq-ir",
    "oq-runtime",
    "oq-types",
]

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/oq_adapters"]

[tool.hatch.build.targets.sdist]
include = ["src/oq_adapters/kit", "README.md"]
