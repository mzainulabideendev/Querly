[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oq-adapter-mongodb"
version = "0.1.0.dev0"
description = "MongoDB adapter for Querly"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Querly Contributors" }]
keywords = ["database", "mongodb", "adapter", "querly"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "oq-core",
    "oq-ir",
    "oq-types",
    "pymongo>=4.6",
    "bson>=0.5",
]

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/oq_adapters/mongodb"]

[tool.hatch.build.targets.sdist]
include = ["src/oq_adapters/mongodb", "README.md"]

[project.entry-points."oq.adapters"]
mongodb = "oq_adapters.mongodb:MongoDBAdapter"