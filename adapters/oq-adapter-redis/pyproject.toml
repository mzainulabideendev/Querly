[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oq-adapter-redis"
version = "0.1.0.dev0"
description = "Redis adapter for Querly"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Querly Contributors" }]
keywords = ["database", "redis", "adapter", "querly"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "oq-core",
    "oq-ir",
    "oq-types",
    "redis>=5.0",
]

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/oq_adapters/redis"]

[tool.hatch.build.targets.sdist]
include = ["src/oq_adapters/redis", "README.md"]

[project.entry-points."oq.adapters"]
redis = "oq_adapters.redis:RedisAdapter"
