[project]
name = "querly-workspace"
version = "0.1.0.dev0"
description = "Development meta-project for the Querly workspace (not published)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "oq-core",
    "oq-ir",
    "oq-types",
    "oq-compiler",
    "oq-runtime",
    "oq-converter",
    "oq-migrations",
    "oq-cli",
    "oq-sdk-python",
    "oq-ai",
    "oq-adapter-aerospike",
    "oq-adapter-cassandra",
    "oq-adapter-clickhouse",
    "oq-adapter-cockroachdb",
    "oq-adapter-couchdb",
    "oq-adapter-db2",
    "oq-adapter-documentdb",
    "oq-adapter-dynamodb",
    "oq-adapter-elasticsearch",
    "oq-adapter-hbase",
    "oq-adapter-kit",
    "oq-adapter-mariadb",
    "oq-adapter-milvus",
    "oq-adapter-mongodb",
    "oq-adapter-mysql",
    "oq-adapter-neo4j",
    "oq-adapter-neptune",
    "oq-adapter-opensearch",
    "oq-adapter-oracle",
    "oq-adapter-postgres",
    "oq-adapter-qdrant",
    "oq-adapter-redis",
    "oq-adapter-scylladb",
    "oq-adapter-sqlite",
    "oq-adapter-sqlserver",
    "oq-adapter-weaviate",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.0",
    "hypothesis>=6.140",
    "ruff>=0.14",
    "mypy>=1.19",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "adapters/*"]

[tool.uv.sources]
oq-core = { workspace = true }
oq-ir = { workspace = true }
oq-types = { workspace = true }
oq-compiler = { workspace = true }
oq-runtime = { workspace = true }
oq-converter = { workspace = true }
oq-migrations = { workspace = true }
oq-cli = { workspace = true }
oq-sdk-python = { workspace = true }
oq-ai = { workspace = true }
oq-adapter-aerospike = { workspace = true }
oq-adapter-cassandra = { workspace = true }
oq-adapter-clickhouse = { workspace = true }
oq-adapter-cockroachdb = { workspace = true }
oq-adapter-couchdb = { workspace = true }
oq-adapter-db2 = { workspace = true }
oq-adapter-documentdb = { workspace = true }
oq-adapter-dynamodb = { workspace = true }
oq-adapter-elasticsearch = { workspace = true }
oq-adapter-hbase = { workspace = true }
oq-adapter-kit = { workspace = true }
oq-adapter-mariadb = { workspace = true }
oq-adapter-milvus = { workspace = true }
oq-adapter-mongodb = { workspace = true }
oq-adapter-mysql = { workspace = true }
oq-adapter-neo4j = { workspace = true }
oq-adapter-neptune = { workspace = true }
oq-adapter-opensearch = { workspace = true }
oq-adapter-oracle = { workspace = true }
oq-adapter-postgres = { workspace = true }
oq-adapter-qdrant = { workspace = true }
oq-adapter-redis = { workspace = true }
oq-adapter-scylladb = { workspace = true }
oq-adapter-sqlite = { workspace = true }
oq-adapter-sqlserver = { workspace = true }
oq-adapter-weaviate = { workspace = true }

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests", "packages"]
markers = [
    "integration: requires an external database service (see docker-compose.test.yml)",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["oq"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = [
    # Security rules that do not apply to a compiler's non-executing modules.
    "S101", # assert is fine outside packaged runtime code (tests are excluded below)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"packages/*/tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/oq-core/src/oq/core"]
mypy_path = "packages/oq-core/src"
explicit_package_bases = true
namespace_packages = true
show_error_codes = true
