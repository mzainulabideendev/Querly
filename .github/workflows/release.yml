name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  distributions:
    name: Build Python distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync --frozen --all-packages

      - name: Build every package and adapter
        run: |
          mkdir -p dist
          for pkg in packages/*/ adapters/*/; do
            uv build --package "$(basename "$pkg")" --out-dir dist
          done

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  studio-desktop:
    name: Build Studio Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [distributions]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: windows-latest
            name: windows-x86_64
          - os: macos-15-intel
            name: macos-x86_64
          - os: macos-latest
            name: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          cd studio/frontend
          npm install
          npm run build
          cd ../..
          uv sync --frozen --all-packages
          uv pip install pyinstaller uvicorn fastapi pydantic

      - name: Build standalone Studio (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller \
            --onefile \
            --name querly-studio-${{ matrix.name }} \
            --add-data "studio/frontend/dist:static" \
            --collect-data querly_studio \
            --log-level WARN \
            tools/studio_launcher.py
          ./dist/querly-studio-${{ matrix.name }} --version

      - name: Build standalone Studio (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --name querly-studio-${{ matrix.name }} `
            --add-data "studio/frontend/dist;static" `
            --collect-data querly_studio `
            --log-level WARN `
            tools/studio_launcher.py
          & "dist/querly-studio-${{ matrix.name }}.exe" --version

      - name: Upload Studio artifact
        uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.name }}
          path: dist/querly-studio-${{ matrix.name }}*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [distributions, cli-binaries, studio-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Querly $TAG" \
              --prerelease \
              --generate-notes
          fi
