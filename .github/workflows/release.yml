name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  distributions:
    name: Build Python distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync workspace
        run: uv sync --frozen --all-packages

      - name: Build every package and adapter
        run: |
          mkdir -p dist
          for pkg in packages/*/ adapters/*/; do
            uv build --package "$(basename "$pkg")" --out-dir dist
          done

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  cli-binaries:
    name: Build oq CLI (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            archive: unix
          - os: windows-latest
            name: windows-x86_64
            archive: windows
          - os: macos-15-intel
            name: macos-x86_64
            archive: unix
          - os: macos-latest
            name: macos-arm64
            archive: unix
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install CLI environment
        run: |
          uv sync --frozen --package oq-cli
          uv pip install pyinstaller

      - name: Build standalone executable (Unix)
        if: matrix.archive == 'unix'
        run: |
          uv run --no-sync pyinstaller \
            --onefile \
            --name oq \
            --collect-data oq.core \
            --log-level WARN \
            tools/oq_launcher.py
          mv dist/oq "dist/oq-${{ matrix.name }}"
          "dist/oq-${{ matrix.name }}" version

      - name: Build standalone executable (Windows)
        if: matrix.archive == 'windows'
        shell: pwsh
        run: |
          uv run --no-sync pyinstaller `
            --onefile `
            --name oq `
            --collect-data oq.core `
            --log-level WARN `
            tools/oq_launcher.py
          Move-Item -Path dist/oq.exe -Destination "dist/oq-${{ matrix.name }}.exe"
          & "dist/oq-${{ matrix.name }}.exe" version

      - name: Upload CLI executable
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: dist/oq-*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [distributions, cli-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Querly $TAG" \
              --prerelease \
              --generate-notes
          fi
