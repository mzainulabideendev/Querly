# Querly disposable integration-test databases.
#
# Status: Phase 0. These services are defined for the Phase 4+ adapter
# integration suite. The Phase 0 test suite does not use them, and no adapter is
# claimed to work against them yet.
#
# Usage (after Phase 4):
#   docker compose -f docker-compose.test.yml up -d
#   uv run pytest -m integration
#   docker compose -f docker-compose.test.yml down -v
#
# Credentials below are intentionally disposable local test credentials. They
# are not used anywhere else and must never be reused with real data.

name: querly-test

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: querly
      POSTGRES_PASSWORD: querly_test_only
      POSTGRES_DB: querly_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querly -d querly_test"]
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: querly_test_only
      MYSQL_DATABASE: querly_test
      MYSQL_USER: querly
      MYSQL_PASSWORD: querly_test_only
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pquerly_test_only"]
      interval: 5s
      timeout: 5s
      retries: 30

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: querly_test_only
      MARIADB_DATABASE: querly_test
      MARIADB_USER: querly
      MARIADB_PASSWORD: querly_test_only
    ports:
      - "53307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: querly
      MONGO_INITDB_ROOT_PASSWORD: querly_test_only
    ports:
      - "57017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "querly_test_only"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "querly_test_only", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
