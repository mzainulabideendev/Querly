[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oq-cli"
version = "0.1.0.dev0"
description = "Querly command-line interface (the `oq` command)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Querly Contributors" }]
keywords = ["database", "cli", "compiler", "querly"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "oq-core",
    "oq-ir",
    "oq-types",
    "oq-compiler",
    "oq-runtime",
    "oq-converter",
    "oq-migrations",
]

[project.scripts]
oq = "oq.cli:main"

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/oq/cli"]

[tool.hatch.build.targets.sdist]
include = ["src/oq/cli", "README.md"]
