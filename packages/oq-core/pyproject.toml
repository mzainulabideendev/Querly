[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oq-core"
version = "0.1.0.dev0"
description = "Querly language core: source model, diagnostics, lexer, parser, and semantic analysis"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Querly Contributors" }]
keywords = ["database", "language", "compiler", "querly"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "lark>=1.2,<2",
]

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/oq/core"]

[tool.hatch.build.targets.sdist]
include = ["src/oq/core", "README.md"]
