[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "oq-ir"
version = "0.1.0.dev0"
description = "Querly universal, versioned intermediate representation for schemas, queries, and plans"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Querly Contributors" }]
keywords = ["database", "language", "intermediate-representation", "querly"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["oq-core"]

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/oq/ir"]

[tool.hatch.build.targets.sdist]
include = ["src/oq/ir", "README.md"]
